<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackFlow · Pipeline & KPI monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1419; --panel:#171e26; --line:#26313d; --text:#e6edf3; --muted:#8b98a5;
          --ok:#3fb950; --fail:#f85149; --warn:#d29922; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; } h1 span { color:var(--muted); font-weight:400; }
  main { padding:24px 28px; display:grid; gap:20px; grid-template-columns:repeat(12, 1fr); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .stat { grid-column:span 3; } .stat b { display:block; font-size:26px; margin-top:4px; }
  .wide { grid-column:span 8; } .side { grid-column:span 4; } .full { grid-column:span 12; }
  .muted { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .pill { padding:2px 8px; border-radius:99px; font-size:12px; }
  .success { background:#1f3a26; color:var(--ok); } .failed { background:#3d1f1f; color:var(--fail); }
  .skipped, .running { background:#3a301a; color:var(--warn); }
  button, select { background:var(--accent); color:#04111f; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .layer { font-size:11px; color:var(--muted); }
  @media (max-width: 900px) { .stat, .wide, .side { grid-column:span 12; } }
</style>
</head>
<body>
<header>
  <h1>TrackFlow <span>· Metrolink City data platform</span></h1>
  <div>
    <select id="scope"><option value="">Full run</option><option value="silver">From Silver</option><option value="gold">From Gold</option></select>
    <button onclick="trigger()">Run pipeline</button>
  </div>
</header>
<main>
  <div class="card stat"><span class="muted">Runs</span><b id="s-runs">–</b></div>
  <div class="card stat"><span class="muted">Success rate</span><b id="s-rate">–</b></div>
  <div class="card stat"><span class="muted">Avg duration</span><b id="s-dur">–</b></div>
  <div class="card stat"><span class="muted">Last run</span><b id="s-last">–</b></div>

  <div class="card wide">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="muted">KPI · actuals and 6-month forecast (80% interval)</span>
      <select id="kpi" onchange="drawKpi()"></select>
    </div>
    <canvas id="chart" height="120"></canvas>
  </div>
  <div class="card side"><span class="muted">Recent runs</span><table id="runs"></table></div>
  <div class="card full"><span class="muted">Tasks · <span id="run-id"></span></span><table id="tasks"></table></div>
  <div class="card full"><span class="muted">Data quality</span><table id="dq"></table></div>
</main>
<script>
let kpiData = {actuals: [], forecast: []}, chart;
const pct = v => (v * 100).toFixed(2) + '%';
const pill = s => `<span class="pill ${s}">${s}</span>`;
const j = u => fetch(u).then(r => r.json());

async function refresh() {
  const [stats, runs] = await Promise.all([j('/api/stats'), j('/api/runs')]);
  document.getElementById('s-runs').textContent = stats.runs ?? 0;
  document.getElementById('s-rate').textContent = stats.success_rate != null ? stats.success_rate + '%' : '–';
  document.getElementById('s-dur').textContent = stats.avg_duration_s != null ? stats.avg_duration_s + 's' : '–';
  document.getElementById('s-last').innerHTML = runs[0] ? pill(runs[0].status) : '–';
  document.getElementById('runs').innerHTML = '<tr><th>Started</th><th>Scope</th><th>Status</th></tr>' +
    runs.map(r => `<tr onclick="showRun('${r.run_id}')" style="cursor:pointer"><td>${r.started_at.replace('T',' ').slice(0,19)}</td><td>${r.selection}</td><td>${pill(r.status)}</td></tr>`).join('');
  if (runs[0]) showRun(runs[0].run_id);
}

async function showRun(id) {
  const d = await j('/api/runs/' + id);
  document.getElementById('run-id').textContent = id;
  document.getElementById('tasks').innerHTML = '<tr><th>Task</th><th>Layer</th><th>Attempt</th><th>Status</th><th>Duration</th><th>Rows</th><th>Error</th></tr>' +
    d.tasks.map(t => `<tr><td>${t.task}</td><td class="layer">${t.layer}</td><td>${t.attempt}</td><td>${pill(t.status)}</td><td>${t.duration_s}s</td><td>${t.rows ?? ''}</td><td>${t.error ?? ''}</td></tr>`).join('');
  document.getElementById('dq').innerHTML = '<tr><th>Table</th><th>Check</th><th>Detail</th><th>Failing rows</th><th>Severity</th><th>Result</th></tr>' +
    d.quality.map(q => `<tr><td>${q.tbl}</td><td>${q.check_type}</td><td>${q.detail}</td><td>${q.failures}</td><td>${q.severity}</td><td>${pill(q.passed ? 'success' : (q.severity === 'warn' ? 'skipped' : 'failed'))}</td></tr>`).join('');
}

async function loadKpis() {
  kpiData = await j('/api/kpis');
  const names = [...new Set(kpiData.actuals.map(a => a.kpi))];
  const sel = document.getElementById('kpi');
  sel.innerHTML = names.map(n => `<option>${n}</option>`).join('');
  drawKpi();
}

function drawKpi() {
  const k = document.getElementById('kpi').value;
  const a = kpiData.actuals.filter(x => x.kpi === k), f = kpiData.forecast.filter(x => x.kpi === k);
  const labels = [...a.map(x => x.year_month), ...f.map(x => x.year_month)];
  const pad = n => Array(n).fill(null);
  const ds = [
    {label: 'Actual', data: [...a.map(x => x.value), ...pad(f.length)], borderColor: '#58a6ff', tension: .25, pointRadius: 0},
    {label: 'Forecast', data: [...pad(a.length - 1), a.at(-1)?.value, ...f.map(x => x.yhat)], borderColor: '#d29922', borderDash: [5, 4], pointRadius: 0},
    {label: 'Upper', data: [...pad(a.length), ...f.map(x => x.yhat_upper)], borderColor: 'transparent', backgroundColor: 'rgba(210,153,34,.15)', fill: '+1', pointRadius: 0},
    {label: 'Lower', data: [...pad(a.length), ...f.map(x => x.yhat_lower)], borderColor: 'transparent', pointRadius: 0},
  ];
  chart?.destroy();
  chart = new Chart(document.getElementById('chart'), {type: 'line', data: {labels, datasets: ds},
    options: {plugins: {legend: {labels: {color: '#8b98a5', filter: i => i.text === 'Actual' || i.text === 'Forecast'}}},
              scales: {x: {ticks: {color: '#8b98a5', maxTicksLimit: 12}, grid: {color: '#26313d'}},
                       y: {ticks: {color: '#8b98a5', callback: pct}, grid: {color: '#26313d'}}}}});
}

async function trigger() {
  const layer = document.getElementById('scope').value;
  const r = await fetch('/api/run', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify(layer ? {from_layer: layer} : {})});
  if (r.status === 409) alert('A run is already in progress');
  setTimeout(() => { refresh(); loadKpis(); }, 2500);
}

refresh(); loadKpis(); setInterval(refresh, 10000);
</script>
</body>
</html>

services:
  trackflow:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - warehouse:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  warehouse:
